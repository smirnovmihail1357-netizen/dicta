name: dicta

# Stack для Portainer (Stacks -> New Stack -> Web editor) и для `docker compose up`.
#
# Перед деплоем задай в окружении стека (Portainer: Environment variables):
#   XDG_RUNTIME_DIR=/run/user/1000
#   WAYLAND_DISPLAY=wayland-1        # у KDE это wayland-1, у wlroots-сессий обычно wayland-0
#   HOST_UID=1000  HOST_GID=1000
# Либо просто скопируй .env.example в .env (для `docker compose` на хосте).

services:
  dictad:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # VULKAN=0 -> CPU-only сборка (glslang не нужен)
        VULKAN: "${VULKAN:-1}"
    image: dicta:local
    container_name: dicta
    restart: unless-stopped

    # Запись с микрофона (PipeWire) и оверлей (Wayland) берутся из сессии хоста,
    # вставка клавиш — из /dev/uinput. Поэтому сокет-каталог сессии монтируется целиком.
    devices:
      - /dev/uinput:/dev/uinput
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
      - dicta-config:/config
      - dicta-models:/models
    environment:
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}
      DICTA_CONFIG: /config/config.toml
      # сокет внутри контейнера: хост управляет через `docker exec dicta dictactl ...`
      DICTA_SOCKET: /run/dicta/dicta.sock
      DICTA_MODEL: /models/ggml-medium-q5_0.bin
      # GGML/Vulkan: какой GPU брать внутри контейнера (индекс вида ggml-устройства, не cardN)
      GGML_VK_VISIBLE_DEVICES: ${GGML_VK_VISIBLE_DEVICES:-0}
    # Контейнер от root видит /dev/uinput и сокеты сессии. Если хочешь от своего UID —
    # раскомментируй: тогда нужна ACL на /dev/uinput (see docs/CONTAINERS.md).
    # user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

volumes:
  dicta-config:
  dicta-models:
