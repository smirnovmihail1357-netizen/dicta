# ~/.config/dicta/config.toml
# Все поля необязательные; значения по умолчанию совпадают с этим файлом.

# ggml-модель whisper.cpp. medium-q5_0 — текущая рабочая (лучше по русскому).
# Для быстрой проверки без нагрузки на VRAM: ggml-small-q5_1.bin + use_gpu = false.
model = "/home/wardreg/.local/share/whisper-cpp/ggml-medium-q5_0.bin"

language = "ru"
beam_size = 5
n_threads = 4

# false -> только CPU (не трогает VRAM, безопасно рядом с llama-swap).
use_gpu = true
gpu_device = 0
flash_attn = false

# Вокабуляр. Если убрать, берётся типовая строка по языку.
prompt = "Разговор о программировании. Rust, TypeScript, JSON, API, git, PipeWire, Wayland, Proxmox."

# PipeWire source для записи. null -> дефолтный микрофон системы.
# Список: pactl list short sources
# mic = "alsa_input.usb-MV-SILICON_fifine_Microphone_20190808-00.analog-stereo"

socket = "/run/user/1000/dicta.sock"

# Как вставлять текст:
#   "paste"    — буфер обмена + клавиши вставки (подбираются под окно);
#   "clipboard"— только буфер обмена;
#   "stdout"   — печатать в терминал (безопасно для проверки);
#   "atspi"    — писать прямо в фокусное поле через AT-SPI2: ни буфера обмена, ни
#                синтезированных клавиш. Требует сборки с фичей atspi:
#                cargo build --release --features dictad/atspi,dictactl/atspi
inject_mode = "paste"
paste_keys = "ctrl+v"

# Только для inject_mode = "atspi". По умолчанию запись разрешена в фокусные объекты
# с ролью поля ввода (entry, password text, combo box, text). Some приложения помечают
# focused не поле, а документ (Firefox — "document web"): в них демону писать нельзя.
# true разрешает любой фокусный редактируемый узел — для диагностики таких окон.
atspi_allow_any_role = false

# Порог уровня речи в шкале индикатора (0..1; -55 дБ -> 0.0, -15 дБ -> 1.0). Считается по
# окнам 300 мс (speech_level), ниже порога распознавание не запускается: на шуме whisper
# сочиняет фразы, и они вставились бы в фокусное окно.
# На этой машине: фон в комнате 0.34-0.35, русская речь 0.9-1.0. Слишком часто пропускает
# шёпот -> убавь до 0.35; вставляет шум -> прибавь до 0.6.
min_level = 0.35

# Тайминги вставки. Приложение читает буфер обмена АСИНХРОННО после нажатия клавиш,
# поэтому прежний буфер возвращаем не сразу, а через clipboard_restore_ms: иначе
# вставится старый буфер вместо диктовки.
clipboard_restore_ms = 2500
paste_delay_ms = 150

# Клавиши под конкретные окна (id окна приходит от адаптера: dictactl toggle --app konsole).
# Имя окна нормализуется: org.kde.konsole -> konsole, firefox.desktop -> firefox.
# Если окна нет в списке (и имени нет в ~/.cache/dicta/focus) — берётся paste_keys.
# Значения по умолчанию уже покрывают терминалы (shift+insert) и браузеры/редакторы (ctrl+v).
# paste_keys_by_app = { konsole = "shift+insert", kitty = "ctrl+shift+v", firefox = "ctrl+v" }

# Авто-остановка записи (VAD). Запись закрывается сама, когда долго тише
# auto_stop_level: демон держит историю уровней и считает подряд идущие
# субпороговые замеры. auto_stop_grace_ms — первые миллисекунды после старта
# авто-остановка спит (дал старт -> начал говорить). max_record_ms — потолок длины.
# Проверено вживую: запись в тишине закрылась через ~1.5 с; при проигрывании аудио
# запись держалась всё время звука и закрылась через ~1 с после его окончания.
auto_stop = true
auto_stop_level = 0.22
auto_stop_after_ms = 1500
auto_stop_grace_ms = 1200
max_record_ms = 60000

# Встроенная глобальная клавиша демона (evdev, читает /dev/input/event*).
# Требует доступа: группа input или udev-ACL. "off" — полагаться на клавишу DE.
hotkey = "ctrl+alt+v"
