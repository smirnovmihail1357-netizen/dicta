# Горячая клавиша диктовки dicta для Hyprland.
# source = ~/projects/dicta/adapters/hyprland/dicta.conf
# Нужен jq (чтобы передать демону имя фокусного окна и подобрать Ctrl+V / Shift+Insert).

bind = SUPER, V, exec, dictactl toggle --app "$(hyprctl activewindow -j | jq -r '.class // .initialClass // empty')"
bind = SUPER SHIFT, V, exec, dictactl cancel

# Если jq не нужен (клавиши вставки берутся paste_keys из конфига):
# bind = SUPER, V, exec, dictactl toggle
