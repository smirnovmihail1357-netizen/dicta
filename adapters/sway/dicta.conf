# Горячая клавиша диктовки dicta для sway.
# include ~/projects/dicta/adapters/sway/dicta.conf
# Нужен jq (имя фокусного окна -> dictactl --app -> Ctrl+V или Shift+Insert).

bindsym $mod+v exec "sh -c 'dictactl toggle --app \"$(swaymsg -t get_tree | jq -r \"recurse(.nodes[]) | select(.focused == true) | (.app_id // .window_properties.class // empty)\")\"'"
bindsym $mod+Shift+v exec dictactl cancel

# Вариант без jq:
# bindsym $mod+v exec dictactl toggle
