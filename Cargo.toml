[workspace]
resolver = "2"
members = ["crates/dicta-core", "crates/dicta-ui", "crates/dictactl", "crates/dictad"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "6"
whisper-rs = "0.16"
whisper-rs-sys = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
