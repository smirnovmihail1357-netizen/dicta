[workspace]
resolver = "2"
members = ["crates/dicta-core", "crates/dictactl", "crates/dictad"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
whisper-rs = { version = "0.16", features = ["vulkan"] }
whisper-rs-sys = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
