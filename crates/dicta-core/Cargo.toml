[package]
name = "dicta-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
hound.workspace = true
regex = "1"
libc = "0.2"
serde.workspace = true
toml.workspace = true
dirs.workspace = true
whisper-rs.workspace = true
whisper-rs-sys.workspace = true
atspi = { version = "0.22", optional = true, default-features = false, features = ["proxies", "async-std"] }
futures = { version = "0.3", optional = true }
zbus = { version = "6.2", optional = true }

[features]
default = ["vulkan"]
# Vulkan (ggml-vulkan, RX 7900 XTX / iGPU). Требует glslangValidator при сборке.
# Снимается так: cargo build --release --no-default-features  (чистый CPU)
vulkan = ["whisper-rs/vulkan", "whisper-rs-sys/vulkan"]
# Вставка через AT-SPI2 (без буфера обмена и без синтезированных клавиш).
# Экспериментально: работает там, где приложение отдаёт интерфейс EditableText
# (Firefox/GTK да; часть Qt-виджетов и Electron — нет).
atspi = ["dep:atspi", "dep:futures", "dep:zbus"]
