[package]
name = "dicta-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
hound.workspace = true
regex = "1"
libc = "0.2"
serde.workspace = true
toml.workspace = true
dirs.workspace = true
whisper-rs.workspace = true
whisper-rs-sys.workspace = true

[features]
default = ["vulkan"]
# Vulkan (ggml-vulkan, RX 7900 XTX / iGPU). Требует glslangValidator при сборке.
# Снимается так: cargo build --release --no-default-features  (чистый CPU)
vulkan = ["whisper-rs/vulkan", "whisper-rs-sys/vulkan"]
