[package]
name = "dictad"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# vulkan - собственная фича dictad (default), dep-строка без features:Windows CI
# собирает CPU-only через --no-default-features, не таща Vulkan upstream.
dicta-core = { path = "../dicta-core", default-features = false }

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.8"
widestring = "1"
# windows 0.58 запинен для прямых зависимостей. cpal 0.18 замыкает windows 0.62
# транзитивно: сосуществование двух мажорных в Cargo.lock принято и изолировано за cpal.
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[features]
default = ["vulkan"]
vulkan = ["dicta-core/vulkan"]
atspi = ["dicta-core/atspi"]
