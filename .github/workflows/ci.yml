name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + tests (Vulkan и CPU-only)
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - uses: actions/checkout@v4

      - name: System deps (whisper.cpp + ggml-vulkan)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev \
            libvulkan-dev glslang-tools glslc pipewire wl-clipboard
          rm -rf /var/lib/apt/lists/*

      - name: Build (Vulkan, default)
        run: |
          set +e
          cargo build --release --locked --workspace 2>&1 | tee /tmp/b1.log
          rc=${PIPESTATUS[0]}
          grep -E "^(error|warning: unused|error\[)|^  -->" /tmp/b1.log | tail -30 \
            | sed 's/%/%25/g; s/\r/%0D/g' \
            | while IFS= read -r line; do echo "::error::${line}"; done
          tail -40 /tmp/b1.log
          exit $rc

      - name: Build (CPU-only)
        run: |
          set +e
          cargo build --release --locked --workspace --no-default-features 2>&1 | tee /tmp/b2.log
          rc=${PIPESTATUS[0]}
          grep -E "^(error|error\[)|^  -->" /tmp/b2.log | tail -30 \
            | sed 's/%/%25/g; s/\r/%0D/g' \
            | while IFS= read -r line; do echo "::error::${line}"; done
          tail -40 /tmp/b2.log
          exit $rc

      - name: Tests
        run: cargo test --workspace

      - name: Shell scripts syntax
        run: |
          for f in adapters/kwin/install.sh systemd/install.sh tools/fetch-model.sh; do
            bash -n "$f"
          done
