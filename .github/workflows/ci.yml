name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + tests (Vulkan и CPU-only)
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - uses: actions/checkout@v4

      - name: System deps (whisper.cpp + ggml-vulkan)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev \
            libvulkan-dev glslang-tools glslc pipewire wl-clipboard
          rm -rf /var/lib/apt/lists/*

      - name: Build (Vulkan, default)
        run: |
          cargo build --release --locked --workspace 2>&1 | tee /tmp/b1.log
          echo "${PIPESTATUS[0]}" > /tmp/rc1
        continue-on-error: true

      - name: Build (CPU-only)
        run: |
          cargo build --release --locked --workspace --no-default-features 2>&1 | tee /tmp/b2.log
          echo "${PIPESTATUS[0]}" > /tmp/rc2
        continue-on-error: true

      - name: Errors to annotations
        if: always()
        run: |
          [ -f /tmp/b1.log ] && tail -n 30 /tmp/b1.log | sed 's/%/%25/g; s/\r/%0D/g; s/^/VULKAN: /' > /tmp/a1.txt
          [ -f /tmp/b2.log ] && tail -n 20 /tmp/b2.log | sed 's/%/%25/g; s/\r/%0D/g; s/^/CPU: /' > /tmp/a2.txt
          cat /tmp/a1.txt /tmp/a2.txt 2>/dev/null | while IFS= read -r line; do echo "::error::$line"; done

      - name: Gate
        if: always()
        run: |
          rc1=$(cat /tmp/rc1 2>/dev/null || echo 1)
          rc2=$(cat /tmp/rc2 2>/dev/null || echo 1)
          echo "rc1=$rc1 rc2=$rc2"
          test "$rc1" = 0 -a "$rc2" = 0

      - name: Tests
        run: cargo test --workspace

      - name: Shell scripts syntax
        run: |
          for f in adapters/kwin/install.sh systemd/install.sh tools/fetch-model.sh; do
            bash -n "$f"
          done
