name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: release archives (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: vulkan
            extra: ""
          - name: cpu
            extra: "--no-default-features"
    container:
      image: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev \
            libvulkan-dev glslang-tools glslc libxkbcommon-dev
          rm -rf /var/lib/apt/lists/*
      - name: Build
        run: cargo build --release --locked --workspace ${{ matrix.extra }}
      - name: Pack
        run: |
          VERSION=$(git describe --tags)
          mkdir -p dist
          tar -C target/release -czvf "dist/dicta-$VERSION-x86_64-linux-${{ matrix.name }}.tar.gz" \
              dictad dictactl dicta-ui
          cp config.example.toml dist/
          cp -r adapters systemd tools dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: dicta-${{ matrix.name }}
          path: dist/

  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -type f -name 'config.example.toml' | head -1 | xargs -I{} cp {} release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
