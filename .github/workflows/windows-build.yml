name: Windows build

on:
  push:
    branches: [windows]
  workflow_dispatch:

jobs:
  build:
    name: flutter build windows (release zip)
    runs-on: windows-latest
    timeout-minutes: 30   # RESEARCH A3: 15-25 min + headroom
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pin = parity with local SDK 3.50.1
          flutter-version: 3.50.1
          cache: true
          pub-cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package release zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dicta-app-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dicta-app-windows-x64
          path: app/dicta-app-windows-x64.zip
          retention-days: 14

  rust:
    name: rust build + tests (CPU-only, dicta-core + dictad)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # scope -p: dicta-ui (wayland) и dicta-settings не собираются на Windows.
      - name: Build (CPU-only, scoped)
        run: cargo build --release --locked --no-default-features -p dicta-core -p dictad

      - name: Tests (CPU-only, scoped)
        run: cargo test --locked --no-default-features -p dicta-core -p dictad

      - name: Upload dictad.exe
        uses: actions/upload-artifact@v4
        with:
          name: dictad-windows-x64
          path: target/release/dictad.exe
          retention-days: 14
