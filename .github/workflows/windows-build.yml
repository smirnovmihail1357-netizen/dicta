name: Windows build

on:
  push:
    branches: [windows]
  workflow_dispatch:

jobs:
  build:
    name: flutter build windows (release zip)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pin = parity with local SDK 3.50.1
          flutter-version: 3.50.1
          cache: true
          pub-cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package release zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dicta-app-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dicta-app-windows-x64
          path: app/dicta-app-windows-x64.zip
          retention-days: 14
